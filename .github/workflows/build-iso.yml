name: Build UniversalOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y xorriso git

      - name: Install Rust nightly and target
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Download Limine binaries
        run: git clone https://github.com/limine-bootloader/limine.git --branch=v8.x-binary --depth=1 limine-bin

      - name: Build UniversalOS ISO
        run: |
          mkdir -p iso_root/boot/limine iso_root/EFI/BOOT
          cd kernel && cargo build --release
          cd ..
          cp kernel/target/x86_64-unknown-none/release/universal-kernel iso_root/boot/universal-kernel
          cp limine-bin/limine-bios.sys limine-bin/limine-bios-cd.bin limine-bin/limine-uefi-cd.bin iso_root/boot/limine/
          cp limine-bin/BOOTX64.EFI iso_root/EFI/BOOT/
          xorriso -as mkisofs -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot boot/limine/limine-uefi-cd.bin \
            -efi-boot-part --efi-boot-image --protective-msdos-label \
            iso_root -o UniversalOS.iso
          ./limine-bin/limine bios-install UniversalOS.iso

      - name: Upload UniversalOS.iso artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalOS-ISO
          path: UniversalOS.iso
